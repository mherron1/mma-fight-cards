
name: Update UFC live event

on:
  schedule:
    # Friday, Saturday and Sunday evenings (UTC)
    - cron: '*/30 16-23 * * 5,6,0'

    # Saturday, Sunday and Monday mornings (UTC)
    - cron: '*/30 0-7 * * 6,0,1'
    - cron: '0 8 * * 6,0,1'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ufc-events
  cancel-in-progress: false

jobs:
  update-live-event:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update live UFC event
        env:
          UFCALENDAR_API_KEY: ${{ secrets.UFCALENDAR_API_KEY }}
        run: node scripts/update-live-event.mjs

      - name: Commit updated live event data
        run: |
          if git diff --quiet -- data/events.json data/fighters-cache.json data/live-event-state.json; then
            echo "No live event changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/events.json data/fighters-cache.json data/live-event-state.json
          git commit -m "chore: update live UFC event"
          git push
