name: Update UFC events

on:
  schedule:
    # Daily at 06:15 UTC.
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ufc-events
  cancel-in-progress: false

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update UFC event data
        env:
          UFCALENDAR_API_KEY: ${{ secrets.UFCALENDAR_API_KEY }}
        run: node scripts/update-events.js

      - name: Commit updated event data
        run: |
          if git diff --quiet -- data/events.json data/fighters-cache.json; then
            echo "No event data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/fighters-cache.json
          git commit -m "chore: update UFC event data"
          git push
